version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Only monitor the root, ignore /docs
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "eslint"
        versions: ["10.x"]
      - dependency-name: "@eslint/js"
        versions: ["10.x"]
      - dependency-name: "typescript"
        versions: ["7.x"]