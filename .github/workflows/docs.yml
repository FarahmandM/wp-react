name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: cd docs && npm ci # Installs docs dependencies
        
      - name: Build website
        run: cd docs && npm run build # Builds the Docusaurus site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build # Docusaurus outputs to a 'build' folder

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5